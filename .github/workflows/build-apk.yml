name: Build Joytify Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build Joytify.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ais-pre-cnxmx5jqmesgju6vftweij-656984162484.asia-southeast1.run.app' }}
        run: npm run build

      - name: Initialize Capacitor Android project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          for dir in android/app/src/main/res/mipmap-*; do
            cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
            cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
            cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png" || true
          done
          npx cap sync android

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Joytify-Android.apk

      - name: Upload Joytify-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: Joytify-Android-APK
          path: Joytify-Android.apk
          retention-days: 30
